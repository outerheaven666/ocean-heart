name: verify-deploy
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "部署地址(不带尾斜杠)"
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: health
        run: |
          echo "--- GET /api/health ---"
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "${{ inputs.base_url }}/api/health"

      - name: diag
        run: |
          echo "--- GET /trpc/_diag ---"
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "${{ inputs.base_url }}/trpc/_diag"

      - name: boards.list
        run: |
          echo "--- GET /trpc/boards.list ---"
          curl -sS -m 60 -w "\nHTTP %{http_code}\n" "${{ inputs.base_url }}/trpc/boards.list?input=%7B%22json%22%3Anull%7D" | head -c 2000

      - name: auth.login
        run: |
          echo "--- POST /trpc/auth.login?batch=1 (与前端一致的 batch 格式) ---"
          curl -sS -m 90 -w "\nHTTP %{http_code}\n" \
            -X POST "${{ inputs.base_url }}/trpc/auth.login?batch=1" \
            -H "Content-Type: application/json" \
            -d '{"0":{"json":{"username":"admin","password":"admin123"}}}' | head -c 2000

      - name: index.html
        run: |
          echo "--- GET / ---"
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "${{ inputs.base_url }}/" | head -c 800
